repos:
  - repo: local
    hooks:
      # Hook 1: agent-factory format & lint
      - id: agent-factory-format-lint
        name: agent-factory format and lint
        entry: bash -c 'cd agent-backend/agent-factory && make format_and_lint'
        language: system
        files: '^agent-backend/agent-factory/.*\.go$'
        pass_filenames: false

      # Hook 2: agent-factory service UT（仅 service 目录变更时触发）
      - id: agent-factory-service-ut
        name: agent-factory service unit tests
        entry: bash -c 'cd agent-backend/agent-factory && make serviceUtAndCoverage'
        language: system
        files: '^agent-backend/agent-factory/src/domain/service/.*\.go$'
        pass_filenames: false
